name: Build preview data

on:
  schedule:
    # 17:20 Asia/Taipei, Monday-Friday.
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build preview data
        env:
          ETF_HOLDINGS_URL: ${{ vars.ETF_HOLDINGS_URL }}
          CMONEY_HOLDINGS_URL: ${{ vars.CMONEY_HOLDINGS_URL }}
          ETF_PRICE_SLEEP_SECONDS: "0"
        run: python scripts/build_all.py

      - name: Commit updated preview data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: build preview data"
          file_pattern: public/preview/*.json

      - name: Configure GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy dashboard to GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
